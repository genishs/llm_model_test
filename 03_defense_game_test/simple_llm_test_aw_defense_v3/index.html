<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Base Defense</title>
    <style>
        * {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #0ff;
            background-color: #000;
            box-shadow: 0 0 20px #0ff;
            max-width: 100vw;
            max-height: 75vh;
            width: auto;
            height: auto;
        }
        #ui {
            margin-top: 10px;
            font-size: 18px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }
        #ui div {
            min-width: 80px;
            text-align: center;
        }
        #gameOver {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #f00;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            min-width: 250px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #0ff;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        button:active {
            background: #0aa;
        }
        @media (max-width: 600px) {
            #ui {
                font-size: 14px;
                gap: 10px;
            }
            #ui div {
                min-width: 60px;
            }
            canvas {
                max-height: 65vh;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Health: <span id="health">10</span></div>
        <div>Stage: <span id="stage">1</span></div>
        <div id="bossIndicator" style="display:none; color:#f00; font-weight:bold;">BOSS!</div>
    </div>
    <div id="gameOver">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Restart</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let health = 10;
        let stage = 1;
        let isBossStage = false;
        let gameRunning = true;
        let enemies = [];
        let projectiles = [];
        let particles = [];
        let lastEnemySpawn = 0;
        let enemySpawnInterval = 1000;
        let lastShotTime = 0;
        let shotInterval = 300;
        let bossSpawned = false;
        
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 30,
            radius: 20,
            color: '#0ff'
        };
        
        function updatePlayerPosition(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            player.x = (clientX - rect.left) * scaleX;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        }
        
        canvas.addEventListener('mousemove', (e) => {
            updatePlayerPosition(e.clientX);
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            updatePlayerPosition(touch.clientX);
        }, { passive: false });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            updatePlayerPosition(touch.clientX);
        }, { passive: false });
        
        class Enemy {
            constructor() {
                this.radius = 15 + Math.random() * 10;
                this.x = Math.random() * (canvas.width - 2 * this.radius) + this.radius;
                this.y = -this.radius;
                this.speed = 1 + Math.random() * 1.5 + (stage * 0.2);
                this.color = `hsl(${Math.random() * 60 + 330}, 100%, 50%)`;
                this.health = 1;
            }
            
            update() {
                this.y += this.speed;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }
        
        class Boss {
            constructor(stageNum) {
                this.radius = 40;
                this.x = canvas.width / 2;
                this.y = -this.radius;
                this.targetY = 100;
                this.speed = 1.5;
                this.color = '#f0f';
                this.health = 30 + (stageNum * 10);
                this.maxHealth = this.health;
                this.moveDirection = 1;
                this.moveSpeed = 2 + (stageNum * 0.5);
                this.shootTimer = 0;
            }
            
            update() {
                if (this.y < this.targetY) {
                    this.y += this.speed;
                } else {
                    this.x += this.moveSpeed * this.moveDirection;
                    if (this.x <= this.radius || this.x >= canvas.width - this.radius) {
                        this.moveDirection *= -1;
                    }
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.closePath();
                
                // Boss health bar
                const barWidth = 80;
                const barHeight = 8;
                const barX = this.x - barWidth / 2;
                const barY = this.y - this.radius - 15;
                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barWidth, barHeight);
                const healthPercent = this.health / this.maxHealth;
                ctx.fillStyle = healthPercent > 0.5 ? '#0f0' : healthPercent > 0.25 ? '#ff0' : '#f00';
                ctx.fillRect(barX, barY, barWidth * healthPercent, barHeight);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barWidth, barHeight);
            }
            
            takeDamage(damage) {
                this.health -= damage;
                if (this.health <= 0) {
                    createExplosion(this.x, this.y, this.color);
                    createExplosion(this.x, this.y, '#fff');
                    createExplosion(this.x, this.y, '#ff0');
                    return true;
                }
                return false;
            }
        }
        
        class Projectile {
            constructor(targetX, targetY) {
                this.x = player.x;
                this.y = player.y - 30;
                this.radius = 5;
                this.color = '#ff0';
                const angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.speed = 8;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3 + 1;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }
            
            draw() {
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
                ctx.globalAlpha = 1;
            }
        }
        
        function findNearestEnemy() {
            let nearest = null;
            let minDist = Infinity;
            for (const enemy of enemies) {
                const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = enemy;
                }
            }
            return nearest;
        }
        
        function spawnEnemies(timestamp) {
            if (isBossStage && !bossSpawned) {
                enemies.push(new Boss(stage));
                bossSpawned = true;
                document.getElementById('bossIndicator').style.display = 'block';
                return;
            }
            
            if (isBossStage && enemies.length === 0) {
                bossSpawned = false;
                isBossStage = false;
                document.getElementById('bossIndicator').style.display = 'none';
                stage++;
                document.getElementById('stage').textContent = stage;
                enemySpawnInterval = Math.max(300, 1000 - stage * 50);
                return;
            }
            
            if (timestamp - lastEnemySpawn > enemySpawnInterval) {
                if (!isBossStage) {
                    enemies.push(new Enemy());
                }
                lastEnemySpawn = timestamp;
                
                const newStage = Math.floor(score / 100) + 1;
                if (newStage > stage && !isBossStage) {
                    stage = newStage;
                    document.getElementById('stage').textContent = stage;
                    
                    if (stage % 4 === 0) {
                        isBossStage = true;
                        bossSpawned = false;
                        enemySpawnInterval = 999999;
                    } else {
                        enemySpawnInterval = Math.max(300, 1000 - stage * 50);
                    }
                } else {
                    if (!isBossStage && enemySpawnInterval > 300) {
                        enemySpawnInterval -= 5;
                    }
                }
            }
        }
        
        function createExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        function updateGame(timestamp) {
            if (!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.closePath();
            
            // Draw player cannon
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 10);
            ctx.lineTo(player.x, player.y - 30);
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.closePath();
            
            // Find nearest enemy and shoot
            const nearestEnemy = findNearestEnemy();
            if (nearestEnemy) {
                const now = timestamp;
                if (now - lastShotTime > shotInterval) {
                    projectiles.push(new Projectile(nearestEnemy.x, nearestEnemy.y));
                    lastShotTime = now;
                }
            }
            
            // Update and draw projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.update();
                p.draw();
                
                if (p.y < 0 || p.x < 0 || p.x > canvas.width || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                }
            }
            
            // Update and draw enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.update();
                enemy.draw();
                
                // Check collision with projectiles
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    const dist = Math.hypot(enemy.x - p.x, enemy.y - p.y);
                    if (dist < enemy.radius + p.radius) {
                        // Check if boss or regular enemy
                        if (enemy instanceof Boss) {
                            const destroyed = enemy.takeDamage(1);
                            if (destroyed) {
                                score += 100 + (stage * 20);
                                document.getElementById('score').textContent = score;
                                enemies.splice(i, 1);
                                projectiles.splice(j, 1);
                                bossSpawned = false;
                                isBossStage = false;
                                document.getElementById('bossIndicator').style.display = 'none';
                                stage++;
                                document.getElementById('stage').textContent = stage;
                                enemySpawnInterval = Math.max(300, 1000 - stage * 50);
                            } else {
                                createExplosion(p.x, p.y, enemy.color);
                                projectiles.splice(j, 1);
                            }
                        } else {
                            // Regular enemy destroyed
                            createExplosion(enemy.x, enemy.y, enemy.color);
                            enemies.splice(i, 1);
                            projectiles.splice(j, 1);
                            score += 10;
                            document.getElementById('score').textContent = score;
                            break;
                        }
                    }
                }
                
                // Check if enemy reached bottom
                if (enemy.y > canvas.height) {
                    if (enemy instanceof Boss) {
                        // Boss reached bottom - reset or damage
                        enemies.splice(i, 1);
                        bossSpawned = false;
                        isBossStage = false;
                        document.getElementById('bossIndicator').style.display = 'none';
                        stage++;
                        document.getElementById('stage').textContent = stage;
                        enemySpawnInterval = Math.max(300, 1000 - stage * 50);
                    } else {
                        health--;
                        document.getElementById('health').textContent = health;
                        enemies.splice(i, 1);
                        if (health <= 0) {
                            gameRunning = false;
                            document.getElementById('finalScore').textContent = score;
                            document.getElementById('gameOver').style.display = 'block';
                        }
                    }
                }
            }
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            spawnEnemies(timestamp);
            
            requestAnimationFrame(updateGame);
        }
        
        function restartGame() {
            score = 0;
            health = 10;
            stage = 1;
            isBossStage = false;
            gameRunning = true;
            enemies = [];
            projectiles = [];
            particles = [];
            lastEnemySpawn = 0;
            enemySpawnInterval = 1000;
            lastShotTime = 0;
            bossSpawned = false;
            player.x = canvas.width / 2;
            
            document.getElementById('score').textContent = score;
            document.getElementById('health').textContent = health;
            document.getElementById('stage').textContent = stage;
            document.getElementById('bossIndicator').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            
            requestAnimationFrame(updateGame);
        }
        
        requestAnimationFrame(updateGame);
    </script>
</body>
</html>
