<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아크 타워 디펜스</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { overflow: hidden; height: 100%; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 8px;
  }
  h1 { font-size: 18px; margin-bottom: 8px; color: #58a6ff; letter-spacing: 1px; }
  #wrap {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    width: 100%;
    max-width: 980px;
    flex: 1;
    min-height: 0;
    justify-content: center;
  }
  #gameCol { flex: 1 1 0; display: flex; justify-content: center; min-width: 0; }
  #gameCanvas {
    background: #161b22;
    border: 2px solid #30363d;
    border-radius: 8px;
    cursor: pointer;
    display: block;
    max-width: 100%;
    height: auto;
    touch-action: none;
  }
  #sidebar {
    width: 220px;
    flex-shrink: 0;
    background: #161b22;
    border: 2px solid #30363d;
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 6px 10px;
    background: #0d1117;
    border-radius: 6px;
  }
  .stat b { font-weight: 700; }
  .hp b { color: #ff7b72; }
  .gold b { color: #d29922; }
  .wave b { color: #58a6ff; }
  .lives b { color: #3fb950; }
  h2 { font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .tower-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: #21262d;
    border: 2px solid transparent;
    border-radius: 6px;
    color: #e6edf3;
    cursor: pointer;
    transition: 0.15s;
    font-size: 13px;
  }
  .tower-btn:hover { background: #30363d; }
  .tower-btn.selected { border-color: #58a6ff; background: #1c2333; }
  .tower-btn.disabled { opacity: 0.4; cursor: not-allowed; }
  .tower-icon {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .tower-info { display: flex; flex-direction: column; line-height: 1.3; }
  .tower-info small { color: #8b949e; font-size: 11px; }
  .btn {
    padding: 10px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 700; transition: 0.15s;
  }
  #startBtn { background: #238636; color: #fff; }
  #startBtn:hover { background: #2ea043; }
  #startBtn:disabled { background: #21262d; color: #8b949e; cursor: default; }
  #speedBtn { background: #30363d; color: #e6edf3; }
  #speedBtn:hover { background: #484f58; }
  #help { font-size: 11px; color: #8b949e; line-height: 1.5; }
  #touchHint { font-size: 11px; color: #58a6ff; text-align: center; line-height: 1.4; }
  #overlay {
    position: fixed; inset: 0; background: rgba(13,17,23,0.92);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    gap: 16px; z-index: 10;
  }
  #overlay h2 { font-size: 36px; color: #58a6ff; text-transform: none; }
  #overlay p { font-size: 16px; color: #b0bac9; }
  #restartBtn { background: #238636; color: #fff; padding: 12px 30px; font-size: 16px; }
  #restartBtn:hover { background: #2ea043; }
</style>
</head>
<body>
  <h1>⚡ ARK TOWER DEFENSE</h1>
  <div id="wrap">
    <canvas id="gameCanvas" width="640" height="640"></canvas>
    <div id="sidebar">
      <div class="stat hp">라이프 <b id="lives">20</b></div>
      <div class="stat gold">골드 <b id="gold">150</b></div>
      <div class="stat wave">웨이브 <b id="wave">0 / 20</b></div>
      <div class="stat" id="bossInfo" style="display:none; flex-direction:column; align-items:stretch; gap:2px;">
        <span style="font-size:11px; color:#8b949e;">보스전</span>
        <b id="bossInfoText" style="font-size:13px;">⚔ 보스전</b>
      </div>
      <div class="stat">점수 <b id="score">0</b></div>

      <h2>타워 건설</h2>
      <div id="towerMenu"></div>

      <button id="startBtn" class="btn">웨이브 시작</button>
      <button id="speedBtn" class="btn">속도: 1x</button>
      <div id="help">
        <b>조작법</b><br>
        • 타워 아이콘 선택 후 지도의 빈 땅을 탭해 건설<br>
        • 완성된타워 탭 → 선택 (사거리 표시)<br>
        • 선택된 타워 탭 → 업그레이드 / 판매<br>
        • 적은 노란 길 따라 이동합니다
        • 4·8·12·16·20 스테이지는 보스전!
      </div>
      <div id="touchHint">📱 모바일: 탭으로 조작</div>
    </div>
  </div>

  <div id="overlay">
    <h2 id="overlayTitle">게임 오버</h2>
    <p id="overlayText"></p>
    <button id="restartBtn" class="btn">다시 하기</button>
  </div>

<script src="game.js"></script>
</body>
</html>
