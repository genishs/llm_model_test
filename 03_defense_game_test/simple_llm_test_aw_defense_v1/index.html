<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Base Defense</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        canvas {
            border: 2px solid #0ff;
            background-color: #000;
            box-shadow: 0 0 20px #0ff;
        }
        #ui {
            margin-top: 10px;
            font-size: 20px;
            display: flex;
            gap: 30px;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #f00;
            padding: 20px;
            text-align: center;
            display: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #0ff;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover {
            background: #0aa;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Health: <span id="health">10</span></div>
        <div>Wave: <span id="wave">1</span></div>
    </div>
    <div id="gameOver">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Restart</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let health = 10;
        let wave = 1;
        let gameRunning = true;
        let enemies = [];
        let projectiles = [];
        let particles = [];
        let lastEnemySpawn = 0;
        let enemySpawnInterval = 1000;
        let lastShotTime = 0;
        let shotInterval = 300;
        
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 30,
            radius: 20,
            color: '#0ff'
        };
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        });
        
        class Enemy {
            constructor() {
                this.radius = 15 + Math.random() * 10;
                this.x = Math.random() * (canvas.width - 2 * this.radius) + this.radius;
                this.y = -this.radius;
                this.speed = 1 + Math.random() * 1.5 + (wave * 0.2);
                this.color = `hsl(${Math.random() * 60 + 330}, 100%, 50%)`;
            }
            
            update() {
                this.y += this.speed;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }
        
        class Projectile {
            constructor(targetX, targetY) {
                this.x = player.x;
                this.y = player.y - 30;
                this.radius = 5;
                this.color = '#ff0';
                const angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.speed = 8;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3 + 1;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }
            
            draw() {
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
                ctx.globalAlpha = 1;
            }
        }
        
        function findNearestEnemy() {
            let nearest = null;
            let minDist = Infinity;
            for (const enemy of enemies) {
                const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = enemy;
                }
            }
            return nearest;
        }
        
        function spawnEnemies(timestamp) {
            if (timestamp - lastEnemySpawn > enemySpawnInterval) {
                enemies.push(new Enemy());
                lastEnemySpawn = timestamp;
                
                const newWave = Math.floor(score / 100) + 1;
                if (newWave > wave) {
                    wave = newWave;
                    document.getElementById('wave').textContent = wave;
                    enemySpawnInterval = Math.max(300, 1000 - wave * 50);
                } else {
                    if (enemySpawnInterval > 300) {
                        enemySpawnInterval -= 5;
                    }
                }
            }
        }
        
        function createExplosion(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        function updateGame(timestamp) {
            if (!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.closePath();
            
            // Draw player cannon
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 10);
            ctx.lineTo(player.x, player.y - 30);
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.closePath();
            
            // Find nearest enemy and shoot
            const nearestEnemy = findNearestEnemy();
            if (nearestEnemy) {
                const now = timestamp;
                if (now - lastShotTime > shotInterval) {
                    projectiles.push(new Projectile(nearestEnemy.x, nearestEnemy.y));
                    lastShotTime = now;
                }
            }
            
            // Update and draw projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.update();
                p.draw();
                
                if (p.y < 0 || p.x < 0 || p.x > canvas.width || p.y > canvas.height) {
                    projectiles.splice(i, 1);
                }
            }
            
            // Update and draw enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.update();
                enemy.draw();
                
                // Check collision with projectiles
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    const dist = Math.hypot(enemy.x - p.x, enemy.y - p.y);
                    if (dist < enemy.radius + p.radius) {
                        // Enemy destroyed
                        createExplosion(enemy.x, enemy.y, enemy.color);
                        enemies.splice(i, 1);
                        projectiles.splice(j, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;
                        break;
                    }
                }
                
                // Check if enemy reached bottom
                if (enemy.y > canvas.height) {
                    health--;
                    document.getElementById('health').textContent = health;
                    enemies.splice(i, 1);
                    if (health <= 0) {
                        gameRunning = false;
                        document.getElementById('finalScore').textContent = score;
                        document.getElementById('gameOver').style.display = 'block';
                    }
                }
            }
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            spawnEnemies(timestamp);
            
            requestAnimationFrame(updateGame);
        }
        
        function restartGame() {
            score = 0;
            health = 10;
            wave = 1;
            gameRunning = true;
            enemies = [];
            projectiles = [];
            particles = [];
            lastEnemySpawn = 0;
            enemySpawnInterval = 1000;
            lastShotTime = 0;
            player.x = canvas.width / 2;
            
            document.getElementById('score').textContent = score;
            document.getElementById('health').textContent = health;
            document.getElementById('wave').textContent = wave;
            document.getElementById('gameOver').style.display = 'none';
            
            requestAnimationFrame(updateGame);
        }
        
        requestAnimationFrame(updateGame);
    </script>
</body>
</html>
