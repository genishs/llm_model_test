<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>简单防御游戏 - Simple Defense Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        h1 { margin-bottom: 10px; color: #00d4ff; }
        #gameContainer {
            position: relative;
            border: 3px solid #00d4ff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        canvas {
            display: block;
            background: #16213e;
        }
        #ui {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .tower-btn {
            padding: 10px 15px;
            border: 2px solid #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .tower-btn:hover {
            background: rgba(0, 212, 255, 0.3);
        }
        .tower-btn.selected {
            background: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .tower-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 16px;
        }
        #stats span {
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        #waveBtn {
            padding: 10px 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #waveBtn:hover {
            background: #ff6b81;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 10;
        }
        #gameOver h2 { color: #e94560; margin-bottom: 15px; }
        #restartBtn {
            padding: 10px 20px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🛡️简单防御游戏</h1>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameOver">
            <h2>游戏结束!</h2>
            <p>消灭敌人数量: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新游戏</button>
        </div>
    </div>
    <div id="stats">
        <span>💰金钱: <span id="money">100</span></span>
        <span>❤️生命: <span id="lives">20</span></span>
        <span>🌊波次: <span id="wave">1</span></span>
        <span>👾消灭: <span id="kills">0</span></span>
    </div>
    <div id="ui">
        <button class="tower-btn selected" data-tower="basic" data-cost="50">
            🔫基本塔 (50💰)
        </button>
        <button class="tower-btn" data-tower="sniper" data-cost="100">
            🎯狙击塔 (100💰)
        </button>
        <button class="tower-btn" data-tower="slow" data-cost="75">
            ❄️减速塔 (75💰)
        </button>
        <button id="waveBtn">下一波开始</button>
    </div>

    <script>
        // Game State
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let money = 100;
        let lives = 20;
        let wave = 1;
        let kills = 0;
        let selectedTowerType = 'basic';
        let gameRunning = true;
        let enemies = [];
        let towers = [];
        let projectiles = [];
        let waveActive = false;
        let enemiesToSpawn = 0;
        let spawnTimer = 0;
        let spawnInterval = 60;
        
        // Tower definitions
        const towerDefs = {
            basic: { cost: 50, range: 120, damage: 10, fireRate: 30, color: '#00d4ff', name: '基本塔' },
            sniper: { cost: 100, range: 200, damage: 30, fireRate: 90, color: '#e94560', name: '狙击塔' },
            slow: { cost: 75, range: 100, damage: 5, fireRate: 40, color: '#4ecdc4', name: '减速塔' }
        };
        
        // Path for enemies to follow
        const path = [
            { x: 0, y: 100 },
            { x: 150, y: 100 },
            { x: 150, y: 300 },
            { x: 400, y: 300 },
            { x: 400, y: 150 },
            { x: 600, y: 150 },
            { x: 600, y: 400 },
            { x: 800, y: 400 }
        ];
        
        // Enemy types
        const enemyTypes = {
            basic: { health: 30, speed: 1.5, reward: 10, color: '#ff6b6b', radius: 12 },
            fast: { health: 20, speed: 2.5, reward: 15, color: '#ffd93d', radius: 10 },
            tank: { health: 80, speed: 1, reward: 25, color: '#6b5b95', radius: 15 }
        };
        
        // UI Elements
        const moneyEl = document.getElementById('money');
        const livesEl = document.getElementById('lives');
        const waveEl = document.getElementById('wave');
        const killsEl = document.getElementById('kills');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const waveBtn = document.getElementById('waveBtn');
        const towerButtons = document.querySelectorAll('.tower-btn');
        
        // Update UI
        function updateUI() {
            moneyEl.textContent = money;
            livesEl.textContent = lives;
            waveEl.textContent = wave;
            killsEl.textContent = kills;
            
            // Update tower button states
            towerButtons.forEach(btn => {
                if (!btn.dataset.tower) return;
                const cost = parseInt(btn.dataset.cost);
                if (money < cost) {
                    btn.classList.add('disabled');
                } else {
                    btn.classList.remove('disabled');
                }
            });
        }
        
        // Tower placement
        canvas.addEventListener('click', (e) => {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Check if placement is valid
            const towerDef = towerDefs[selectedTowerType];
            if (money < towerDef.cost) return;
            
            // Check if too close to path
            let tooCloseToPath = false;
            for (let i = 0; i < path.length - 1; i++) {
                const p1 = path[i];
                const p2 = path[i + 1];
                const dist = pointToLineDistance(x, y, p1.x, p1.y, p2.x, p2.y);
                if (dist < 30) {
                    tooCloseToPath = true;
                    break;
                }
            }
            if (tooCloseToPath) return;
            
            // Check if too close to other towers
            for (const tower of towers) {
                const dist = Math.hypot(tower.x - x, tower.y - y);
                if (dist < 40) return;
            }
            
            // Place tower
            towers.push({
                x, y,
                type: selectedTowerType,
                def: towerDef,
                cooldown: 0,
                angle: 0
            });
            
            money -= towerDef.cost;
            updateUI();
        });
        
        // Point to line distance
        function pointToLineDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;
            
            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;
            if (lenSq !== 0) param = dot / lenSq;
            
            let xx, yy;
            if (param < 0) {
                xx = x1; yy = y1;
            } else if (param > 1) {
                xx = x2; yy = y2;
            } else {
                xx = x1 + param * C;
                yy = y1 + param * D;
            }
            
            return Math.hypot(px - xx, py - yy);
        }
        
        // Spawn enemy
        function spawnEnemy() {
            let type = 'basic';
            if (wave >= 3 && Math.random() < 0.3) type = 'fast';
            if (wave >= 5 && Math.random() < 0.2) type = 'tank';
            
            const enemyDef = enemyTypes[type];
            enemies.push({
                x: path[0].x,
                y: path[0].y,
                type,
                def: enemyDef,
                health: enemyDef.health + (wave - 1) * 5,
                maxHealth: enemyDef.health + (wave - 1) * 5,
                pathIndex: 0,
                pathProgress: 0,
                slowTimer: 0
            });
        }
        
        // Start wave
        function startWave() {
            if (waveActive) return;
            waveActive = true;
            enemiesToSpawn = 5 + wave * 2;
            spawnTimer = 0;
            waveBtn.disabled = true;
        }
        
        // Update game
        function update() {
            if (!gameRunning) return;
            
            // Spawn enemies
            if (waveActive && enemiesToSpawn > 0) {
                spawnTimer++;
                if (spawnTimer >= spawnInterval) {
                    spawnEnemy();
                    enemiesToSpawn--;
                    spawnTimer = 0;
                }
            }
            
            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                // Slow effect
                if (enemy.slowTimer > 0) {
                    enemy.slowTimer--;
                }
                
                // Move along path
                const target = path[enemy.pathIndex + 1];
                if (!target) {
                    // Enemy reached end
                    lives--;
                    enemies.splice(i, 1);
                    updateUI();
                    if (lives <= 0) gameOver();
                    continue;
                }
                
                const dx = target.x - enemy.x;
                const dy = target.y - enemy.y;
                const dist = Math.hypot(dx, dy);
                const speed = enemy.def.speed * (enemy.slowTimer > 0 ? 0.5 : 1);
                
                if (dist < speed) {
                    enemy.x = target.x;
                    enemy.y = target.y;
                    enemy.pathIndex++;
                } else {
                    enemy.x += (dx / dist) * speed;
                    enemy.y += (dy / dist) * speed;
                }
            }
            
            // Update towers
            for (const tower of towers) {
                if (tower.cooldown > 0) {
                    tower.cooldown--;
                    continue;
                }
                
                // Find target
                let target = null;
                let minDist = Infinity;
                for (const enemy of enemies) {
                    const dist = Math.hypot(tower.x - enemy.x, tower.y - enemy.y);
                    if (dist <= tower.def.range && dist < minDist) {
                        minDist = dist;
                        target = enemy;
                    }
                }
                
                if (target) {
                    // Fire projectile
                    const angle = Math.atan2(target.y - tower.y, target.x - tower.x);
                    tower.angle = angle;
                    projectiles.push({
                        x: tower.x,
                        y: tower.y,
                        target,
                        speed: 5,
                        damage: tower.def.damage,
                        type: tower.type,
                        angle
                    });
                    tower.cooldown = tower.def.fireRate;
                }
            }
            
            // Update projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                
                if (!proj.target || proj.target.health <= 0) {
                    projectiles.splice(i, 1);
                    continue;
                }
                
                const dx = proj.target.x - proj.x;
                const dy = proj.target.y - proj.y;
                const dist = Math.hypot(dx, dy);
                
                if (dist < proj.speed) {
                    // Hit enemy
                    proj.target.health -= proj.damage;
                    if (proj.type === 'slow') {
                        proj.target.slowTimer = 120;
                    }
                    
                    if (proj.target.health <= 0) {
                        money += proj.target.def.reward;
                        kills++;
                        updateUI();
                    }
                    projectiles.splice(i, 1);
                    continue;
                }
                
                proj.x += (dx / dist) * proj.speed;
                proj.y += (dy / dist) * proj.speed;
            }
            
            // Check wave completion
            if (waveActive && enemies.length === 0 && enemiesToSpawn === 0) {
                waveActive = false;
                wave++;
                money += 20;
                waveBtn.disabled = false;
                updateUI();
            }
        }
        
        // Draw game
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw path
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
            
            // Draw path border
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 42;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
            
            // Draw towers
            for (const tower of towers) {
                // Tower range indicator
                ctx.fillStyle = tower.def.color + '20';
                ctx.beginPath();
                ctx.arc(tower.x, tower.y, tower.def.range, 0, Math.PI * 2);
                ctx.fill();
                
                // Tower body
                ctx.fillStyle = tower.def.color;
                ctx.beginPath();
                ctx.arc(tower.x, tower.y, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Tower cannon
                ctx.strokeStyle = tower.def.color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(tower.x, tower.y);
                ctx.lineTo(
                    tower.x + Math.cos(tower.angle) * 20,
                    tower.y + Math.sin(tower.angle) * 20
                );
                ctx.stroke();
            }
            
            // Draw enemies
            for (const enemy of enemies) {
                // Enemy body
                ctx.fillStyle = enemy.def.color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.def.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Health bar
                const healthPercent = enemy.health / enemy.maxHealth;
                ctx.fillStyle = '#333';
                ctx.fillRect(enemy.x - 12, enemy.y - enemy.def.radius - 8, 24, 4);
                ctx.fillStyle = healthPercent > 0.5 ? '#4CAF50' : '#f44336';
                ctx.fillRect(enemy.x - 12, enemy.y - enemy.def.radius - 8, 24 * healthPercent, 4);
                
                // Slow indicator
                if (enemy.slowTimer > 0) {
                    ctx.strokeStyle = '#4ecdc4';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemy.def.radius + 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            
            // Draw projectiles
            for (const proj of projectiles) {
                ctx.fillStyle = proj.type === 'sniper' ? '#e94560' : 
                               proj.type === 'slow' ? '#4ecdc4' : '#00d4ff';
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw spawn point
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(path[0].x, path[0].y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('起点', path[0].x, path[0].y - 15);
            
            // Draw end point
            ctx.fillStyle = '#f44336';
            ctx.beginPath();
            ctx.arc(path[path.length - 1].x, path[path.length - 1].y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillText('终点', path[path.length - 1].x, path[path.length - 1].y - 15);
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreEl.textContent = kills;
            gameOverEl.style.display = 'block';
        }
        
        // Restart game
        function restartGame() {
            money = 100;
            lives = 20;
            wave = 1;
            kills = 0;
            enemies = [];
            towers = [];
            projectiles = [];
            waveActive = false;
            enemiesToSpawn = 0;
            gameRunning = true;
            gameOverEl.style.display = 'none';
            waveBtn.disabled = false;
            updateUI();
        }
        
        // Tower button selection
        towerButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('disabled')) return;
                towerButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedTowerType = btn.dataset.tower;
            });
        });
        
        // Wave button
        waveBtn.addEventListener('click', startWave);
        
        // Restart button
        restartBtn.addEventListener('click', restartGame);
        
        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        updateUI();
        gameLoop();
    </script>
</body>
</html>
