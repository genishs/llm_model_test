<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense - 성벽 방어작전</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="gameHeader">
            <div class="header-item">
                <span class="label">Wave:</span>
                <span class="value" id="waveDisplay">1</span>
            </div>
            <div class="header-item">
                <span class="label">Gold:</span>
                <span class="value" id="goldDisplay">100</span>
            </div>
            <div class="header-item">
                <span class="label">Lives:</span>
                <span class="value" id="livesDisplay">20</span>
            </div>
            <div class="header-item">
                <span class="label">Score:</span>
                <span class="value" id="scoreDisplay">0</span>
            </div>
            <button id="startWaveBtn" class="btn btn-start">Wave 시작</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="towerPanel">
            <div class="tower-option" data-tower="basic">
                <div class="tower-icon" style="background: #4a90d9;"></div>
                <span>기본 터렛</span>
                <span class="tower-cost">💰 50</span>
            </div>
            <div class="tower-option" data-tower="sniper">
                <div class="tower-icon" style="background: #d94a4a;"></div>
                <span>저격터렛</span>
                <span class="tower-cost">💰 100</span>
            </div>
            <div class="tower-option" data-tower="slow">
                <div class="tower-icon" style="background: #4ad9a0;"></div>
                <span>감속 터렛</span>
                <span class="tower-cost">💰 75</span>
            </div>
            <div class="tower-option" data-tower="bomb">
                <div class="tower-icon" style="background: #d9a04a;"></div>
                <span>폭발 터렛</span>
                <span class="tower-cost">💰 150</span>
            </div>
        </div>
        <div id="gameOverlay">
            <div id="startScreen" class="overlay-screen">
                <h1>🏰 성벽 방어작전</h1>
                <p>적들이 성벽을 향해 접근합니다! 터렛을 세워 적들을 막아내세요.</p>
                <div class="instructions">
                    <h3>조작법:</h3>
                    <p>1. 아래 패널에서 터렛을 선택합니다</p>
                    <p>2. 맵의 빈 공간에 터렛을 배치합니다</p>
                    <p>3. "Wave 시작" 버튼으로 적을 보냅니다</p>
                    <p>4. 적을 처치하면 보상을 받습니다</p>
                </div>
                <button id="startGameBtn" class="btn btn-primary">게임 시작</button>
            </div>
            <div id="gameOverScreen" class="overlay-screen hidden">
                <h1>💀 게임 오버</h1>
                <p>최종 점수: <span id="finalScore">0</span></p>
                <p>도달한 Wave: <span id="finalWave">0</span></p>
                <button id="restartBtn" class="btn btn-primary">다시 시작</button>
            </div>
            <div id="winScreen" class="overlay-screen hidden">
                <h1>🎉 승리!</h1>
                <p>모든 Wave를クリア했습니다!</p>
                <p>최종 점수: <span id="winScore">0</span></p>
                <button id="winRestartBtn" class="btn btn-primary">다시 시작</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
