<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dragonflight - 스크롤 슈팅</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="480" height="720"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <span class="hud-item">SCORE <b id="hud-score">0</b></span>
        <span class="hud-item">DIST <b id="hud-dist">0</b>m</span>
      </div>
      <div class="hud-row">
        <span class="hud-item">COIN <b id="hud-coin">0</b></span>
        <span class="hud-item">KILL <b id="hud-kill">0</b></span>
      </div>
      <div class="hud-row hud-power">
        <span id="hud-power"></span>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>DRAGONFLIGHT</h1>
      <p class="subtitle">세로 스크롤 슈팅</p>
      <div class="instructions">
        <p><b>조작</b></p>
        <p>좌우 키 (← / →) 또는 마우스/터치로 이동</p>
        <p>공격은 자동으로 계속 발사됩니다.</p>
        <hr />
        <p>적 웨이브를 격추하고 코인을 모으세요.</p>
        <p>경고 후 운석이 떨어집니다. 보스를 처치하세요.</p>
      </div>
      <button id="start-btn">게임 시작</button>
      <p class="hint">SPACE 또는 클릭으로 시작</p>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <div class="result">
        <div><span>SCORE</span><b id="final-score">0</b></div>
        <div><span>DISTANCE</span><b id="final-dist">0m</b></div>
        <div><span>KILLS</span><b id="final-kill">0</b></div>
        <div><span>COINS</span><b id="final-coin">0</b></div>
      </div>
      <button id="restart-btn">다시 시작</button>
      <p class="hint">SPACE 또는 클릭으로 재시작</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
