<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>드래곤플레이트 - Dragon Flight</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
canvas {
  display: block;
  image-rendering: pixelated;
  cursor: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GAME_WIDTH = 480;
const GAME_HEIGHT = 720;
let isMobile = false;

function resizeCanvas() {
  isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
  const scaleX = window.innerWidth / GAME_WIDTH;
  const scaleY = window.innerHeight / GAME_HEIGHT;
  const scale = Math.min(scaleX, scaleY);
  canvas.width = GAME_WIDTH;
  canvas.height = GAME_HEIGHT;
  canvas.style.width = (GAME_WIDTH * scale) + 'px';
  canvas.style.height = (GAME_HEIGHT * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ── Game states ──
const STATE = { MENU: 'menu', CREDIT_INSERT: 'credit_insert', PLAYING: 'playing', GAMEOVER: 'gameover', CONTINUE_COUNTDOWN: 'continue_countdown', STAGE_CLEAR: 'stage_clear' };
let gameState = STATE.MENU;

// ── Arcade credits ──
let arcadeCredits = 3;   // 크레딧 코인 (아케이드 크레딧)
const CREDIT_COST_START = 1;
const CREDIT_COST_CONTINUE = 1;
const CREDIT_COIN_VALUE = 10; // 크레딧 코인 1개 = 10크레딧

// ── Score, stage, etc ──
let score = 0;
let distance = 0;
let coins = 0;         // 게임 안에서 줍는 코인
let killCount = 0;
let stageNumber = 1;   // 스테이지 번호
let bossActive = false;
let bossDefeated = 0;
let difficultyMultiplier = 1;
let frameCount = 0;

// ── Continue countdown ──
let continueCountdown = 0;
let continueSelected = false;

// ── Stage clear ──
let stageClearTimer = 0;

const player = {
  x: GAME_WIDTH / 2, y: GAME_HEIGHT - 100,
  width: 40, height: 50, speed: 6,
  attackLevel: 1, magnetRange: 0,
  shieldActive: false, shieldTimer: 0,
  fireRate: 8, fireTimer: 0, invincible: 0,
  trailParticles: []
};

let bullets = [], enemies = [], enemyBullets = [], particles = [];
let dropItems = [], meteorWarnings = [], meteors = [], stars = [], explosions = [];

const keys = {};
let mouseX = GAME_WIDTH / 2;
let mouseDown = false;
let useMouseControl = false;

let creditInsertBlink = 0;
let creditInsertActive = false;

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
  handleInput();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) / (rect.width / GAME_WIDTH);
  useMouseControl = true;
});
canvas.addEventListener('mousedown', e => {
  mouseDown = true; useMouseControl = true;
  handleInput();
});

let touchStartX = null;
let touchCanvasStartX = null;
let touchActive = false;

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  if (touchStartX !== null && touchCanvasStartX !== null) {
    const touchDelta = (touch.clientX - touchStartX) / (rect.width / GAME_WIDTH);
    player.x = touchCanvasStartX + touchDelta;
    player.x = Math.max(player.width/2, Math.min(GAME_WIDTH - player.width/2, player.x));
  } else {
    mouseX = (touch.clientX - rect.left) / (rect.width / GAME_WIDTH);
    useMouseControl = true;
  }
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchCanvasStartX = player.x;
  mouseX = (touch.clientX - rect.left) / (rect.width / GAME_WIDTH);
  mouseDown = true; useMouseControl = true;
  touchActive = true;
  handleInput();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  mouseDown = false;
  touchStartX = null;
  touchCanvasStartX = null;
  touchActive = false;
}, { passive: false });
canvas.addEventListener('touchcancel', e => {
  mouseDown = false;
  touchStartX = null;
  touchCanvasStartX = null;
  touchActive = false;
});

function handleInput() {
  creditInsertBlink++;
  if (gameState === STATE.MENU) {
    // 스페이스바/엔터 = 크레딧 투입
    if (keys[' '] || keys['Enter']) {
      insertCredit();
    }
    // 클릭/터치 = 게임 시작 (크레딧 있음)
    if (arcadeCredits >= CREDIT_COST_START) {
      startGame();
    }
  } else if (gameState === STATE.CREDIT_INSERT) {
    // 스페이스바/엔터 = 크레딧 투입, ESC/Back = 나가기
    if (keys[' ']) {
      insertCredit();
    }
    if (keys['Escape'] || keys['Backspace']) {
      gameState = STATE.MENU;
    }
  } else if (gameState === STATE.GAMEOVER) {
    // 클릭/터치/스페이스/엔터 = 컨티뉴 시도 (크레딧 있으면)
    if (arcadeCredits >= CREDIT_COST_CONTINUE) {
      startContinueCountdown();
    } else {
      // 크레딧 없음 -> 타이틀
      gameState = STATE.MENU;
    }
  } else if (gameState === STATE.CONTINUE_COUNTDOWN) {
    // 컨티뉴 카운트다운 중 스페이스바/엔터/클릭/터치 = 컨티뉴 결정
    if (!continueSelected) {
      continueSelected = true;
    }
  }
}

function insertCredit() {
  // 추가 크레딧 투입 (메인에서는 1크레딧 추가)
  arcadeCredits += 1;
  // 피드백 파티클
}

function startGame() {
  if (arcadeCredits < CREDIT_COST_START) {
    gameState = STATE.CREDIT_INSERT;
    return;
  }
  arcadeCredits -= CREDIT_COST_START;
  gameState = STATE.PLAYING;
  score = 0; distance = 0; coins = 0; killCount = 0;
  stageNumber = 1; bossActive = false; bossDefeated = 0; difficultyMultiplier = 1; frameCount = 0;
  player.x = GAME_WIDTH/2; player.y = GAME_HEIGHT-100;
  player.attackLevel = 1; player.magnetRange = 0;
  player.shieldActive = false; player.shieldTimer = 0;
  player.fireRate = 8; player.fireTimer = 0; player.invincible = 0;
  player.trailParticles = [];
  bullets=[]; enemies=[]; enemyBullets=[]; particles=[];
  dropItems=[]; meteorWarnings=[]; meteors=[]; explosions=[];
  initStars();
  spawnWave();
}

function startContinueCountdown() {
  arcadeCredits -= CREDIT_COST_CONTINUE;
  gameState = STATE.CONTINUE_COUNTDOWN;
  continueCountdown = 180; // 3초 (60fps)
  continueSelected = false;
}

function getStageFromWave(wave) {
  return Math.floor((wave - 1) / 5) + 1;
}

function isBossWave(wave) {
  return wave % 5 === 0;
}

function spawnWave() {
  const waveInStage = ((stageNumber - 1) * 5);
  let nextWave = waveNumber;
  waveNumber++;
  // stageNumber is now updated based on wave
  if (isBossWave(waveNumber)) {
    bossActive = true;
    const stage = getStageFromWave(waveNumber);
    const bossHp = 40 + stage * 20 + waveNumber * 3;
    enemies.push({ x:GAME_WIDTH/2, y:-60, width:80, height:90, hp:bossHp, maxHp:bossHp,
      speed:1.2, type:'boss', moveTimer:0, movePhase:0, isBoss:true });
  } else {
    const stage = getStageFromWave(waveNumber);
    const enemyCount = 3 + stage * 2 + Math.floor(waveNumber*0.3);
    const hasMeteor = waveNumber % 3 === 0 && waveNumber > 2;
    if (hasMeteor) {
      const meteorX = Math.random()*(GAME_WIDTH-160)+80;
      meteorWarnings.push({ x:meteorX, y:0, width:120, timer:180, targetY:GAME_HEIGHT*0.5 });
    }
    for (let i=0; i<enemyCount; i++) {
      const x = 60+Math.random()*(GAME_WIDTH-120), y = -40-Math.random()*100;
      const stage = getStageFromWave(waveNumber);
      const hp = 3 + stage * 2 + Math.floor(waveNumber*0.4*difficultyMultiplier);
      const speed = 1.2 + Math.random()*1.5 + stage*0.2 + waveNumber*0.05;
      enemies.push({ x, y, width:36, height:44, hp, maxHp:hp, speed,
        type:Math.floor(Math.random()*4), moveTimer:Math.random()*Math.PI*2, isBoss:false });
    }
  }
}

let waveNumber = 0;

function fireBullets() {
  player.fireTimer--;
  if (player.fireTimer > 0) return;
  player.fireTimer = player.fireRate;
  const lv = player.attackLevel;
  if (lv === 1) {
    bullets.push({ x:player.x, y:player.y-30, vx:0, vy:-10, isEnemy:false, damage:1 });
  } else if (lv === 2) {
    bullets.push({ x:player.x-8, y:player.y-25, vx:0, vy:-10, isEnemy:false, damage:1 });
    bullets.push({ x:player.x+8, y:player.y-25, vx:0, vy:-10, isEnemy:false, damage:1 });
  } else if (lv === 3) {
    bullets.push({ x:player.x, y:player.y-30, vx:0, vy:-11, isEnemy:false, damage:1 });
    bullets.push({ x:player.x-15, y:player.y-20, vx:-1, vy:-10, isEnemy:false, damage:1 });
    bullets.push({ x:player.x+15, y:player.y-20, vx:1, vy:-10, isEnemy:false, damage:1 });
  } else {
    bullets.push({ x:player.x, y:player.y-30, vx:0, vy:-12, isEnemy:false, damage:2 });
    bullets.push({ x:player.x-12, y:player.y-20, vx:-1.5, vy:-10, isEnemy:false, damage:1 });
    bullets.push({ x:player.x+12, y:player.y-20, vx:1.5, vy:-10, isEnemy:false, damage:1 });
    bullets.push({ x:player.x-22, y:player.y-15, vx:-2.5, vy:-9, isEnemy:false, damage:1 });
    bullets.push({ x:player.x+22, y:player.y-15, vx:2.5, vy:-9, isEnemy:false, damage:1 });
  }
}

function updatePlayer() {
  if (useMouseControl) { player.x += (mouseX-player.x)*0.15; }
  else {
    if (keys['ArrowLeft']||keys['a']||keys['A']) player.x -= player.speed;
    if (keys['ArrowRight']||keys['d']||keys['D']) player.x += player.speed;
  }
  player.x = Math.max(player.width/2, Math.min(GAME_WIDTH-player.width/2, player.x));
  if (player.shieldTimer > 0) { player.shieldTimer--; if (player.shieldTimer<=0) player.shieldActive=false; }
  if (player.invincible > 0) player.invincible--;
  if (frameCount%2===0) {
    player.trailParticles.push({ x:player.x+(Math.random()-0.5)*10, y:player.y+25, life:20 });
  }
  player.trailParticles = player.trailParticles.filter(p => { p.life--; p.y+=2; return p.life>0; });
}

function updateBullets() {
  bullets = bullets.filter(b => { b.x+=(b.vx||0); b.y+=b.vy;
    return b.y>-20 && b.y<GAME_HEIGHT+20 && b.x>-20 && b.x<GAME_WIDTH+20; });
  enemyBullets = enemyBullets.filter(b => { b.x+=(b.vx||0); b.y+=b.vy;
    return b.y>-20 && b.y<GAME_HEIGHT+20 && b.x>-20 && b.x<GAME_WIDTH+20; });
}

function updateEnemies() {
  for (let i=enemies.length-1; i>=0; i--) {
    const e = enemies[i];
    if (e.isBoss) {
      e.moveTimer++;
      if (e.y < 100) { e.y += e.speed; }
      else {
        e.x += Math.sin(e.moveTimer*0.02)*2;
        if (e.moveTimer%40===0) {
          const dx=player.x-e.x, dy=player.y-e.y, dist=Math.sqrt(dx*dx+dy*dy);
          enemyBullets.push({ x:e.x, y:e.y+40, vx:(dx/dist)*3, vy:(dy/dist)*3, isEnemy:true });
        }
        if (e.moveTimer%80===0) {
          for (let a=0; a<8; a++) {
            const angle = (Math.PI*2/8)*a+e.moveTimer*0.01;
            enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(angle)*2.5, vy:Math.sin(angle)*2.5, isEnemy:true });
          }
        }
      }
    } else {
      e.y += e.speed; e.moveTimer += 0.03;
      e.x += Math.sin(e.moveTimer)*1.5;
      if (waveNumber>3 && Math.random()<0.002*difficultyMultiplier) {
        const dx=player.x-e.x, dy=player.y-e.y, dist=Math.sqrt(dx*dx+dy*dy);
        enemyBullets.push({ x:e.x, y:e.y+20, vx:(dx/dist)*2.5, vy:(dy/dist)*2.5, isEnemy:true });
      }
    }
    if (e.y > GAME_HEIGHT+100) enemies.splice(i,1);
  }
  if (enemies.length === 0) spawnWave();
}

function updateCollisions() {
  for (let bi=bullets.length-1; bi>=0; bi--) {
    const b = bullets[bi];
    for (let ei=enemies.length-1; ei>=0; ei--) {
      const e = enemies[ei];
      if (Math.abs(b.x-e.x)<e.width/2+4 && Math.abs(b.y-e.y)<e.height/2+8) {
        e.hp -= b.damage; bullets.splice(bi,1);
        createExplosion(b.x, b.y, 5, '#88ff88');
        if (e.hp <= 0) {
          createExplosion(e.x, e.y, e.isBoss?50:20);
          killCount++; score += e.isBoss?1000:10+waveNumber*2;
          if (e.isBoss) {
            bossDefeated++; bossActive=false;
            createScorePopup(e.x,e.y,'BOSS 처치! +1000','#ffcc00');
            score+=500;
            // 스테이지 클리어
            stageNumber = getStageFromWave(waveNumber);
            gameState = STATE.STAGE_CLEAR;
            stageClearTimer = 180; // 3초
          }
          const coinCount = e.isBoss?10:Math.floor(Math.random()*3)+1;
          for (let c=0; c<coinCount; c++) {
            dropItems.push({ x:e.x+(Math.random()-0.5)*30, y:e.y, type:'coin', vy:Math.random()*2, collected:false });
          }
          if (Math.random() < (e.isBoss?1.0:0.1)) {
            const types = ['attack','magnet','shield'];
            dropItems.push({ x:e.x, y:e.y, type:types[Math.floor(Math.random()*3)], vy:1, collected:false });
          }
          enemies.splice(ei,1);
        }
        break;
      }
    }
  }
  if (player.invincible <= 0) {
    for (let ei=enemies.length-1; ei>=0; ei--) {
      const e = enemies[ei];
      if (Math.abs(player.x-e.x)<(player.width+e.width)/2-5 && Math.abs(player.y-e.y)<(player.height+e.height)/2-5) {
        if (player.shieldActive) { player.shieldActive=false; player.shieldTimer=0;
          createExplosion(e.x,e.y,30); enemies.splice(ei,1); player.invincible=30; }
        else { gameState='gameover'; createExplosion(player.x,player.y,50); return; }
      }
    }
    for (let bi=enemyBullets.length-1; bi>=0; bi--) {
      const b = enemyBullets[bi];
      if (Math.abs(player.x-b.x)<player.width/2 && Math.abs(player.y-b.y)<player.height/2) {
        if (player.shieldActive) { player.shieldActive=false; player.shieldTimer=0;
          enemyBullets.splice(bi,1); player.invincible=30; }
        else { gameState='gameover'; createExplosion(player.x,player.y,50); return; }
      }
    }
  }
  const magnetR = player.magnetRange>0 ? player.magnetRange : 0;
  for (let i=dropItems.length-1; i>=0; i--) {
    const item = dropItems[i]; item.y += item.vy;
    if (magnetR>0 && item.type==='coin') {
      const dx=player.x-item.x, dy=player.y-item.y, dist=Math.sqrt(dx*dx+dy*dy);
      if (dist<magnetR) { item.x+=(dx/dist)*5; item.y+=(dy/dist)*5; }
    }
    if (item.y > GAME_HEIGHT+20) { dropItems.splice(i,1); continue; }
    const dx=player.x-item.x, dy=player.y-item.y, dist=Math.sqrt(dx*dx+dy*dy);
    if (dist<30) {
      if (item.type==='coin') { coins++; score+=5; createScorePopup(item.x,item.y,'+5','#ffcc00'); }
      else if (item.type==='attack') { player.attackLevel=Math.min(player.attackLevel+1,5); createScorePopup(item.x,item.y,'공격 강화!','#ff8800'); }
      else if (item.type==='magnet') { player.magnetRange=100; player.shieldTimer=600; createScorePopup(item.x,item.y,'자석!','#8844ff'); }
      else if (item.type==='shield') { player.shieldActive=true; player.shieldTimer=600; createScorePopup(item.x,item.y,'방어막!','#44aaff'); }
      dropItems.splice(i,1);
    }
  }
}

function updateMeteors() {
  for (let i=meteorWarnings.length-1; i>=0; i--) {
    const w = meteorWarnings[i]; w.timer--;
    if (w.timer<=0) { meteors.push({ x:w.x, y:-30, width:w.width, speed:4+Math.random()*2 }); meteorWarnings.splice(i,1); }
  }
  for (let i=meteors.length-1; i>=0; i--) {
    const m = meteors[i]; m.y += m.speed;
    if (player.invincible<=0 && Math.abs(player.x-m.x)<(player.width+m.width)/2 && Math.abs(player.y-m.y)<(player.height+m.width/2)/2) {
      if (player.shieldActive) { player.shieldActive=false; player.shieldTimer=0;
        meteors.splice(i,1); player.invincible=30; createExplosion(m.x,m.y,20); }
      else { gameState='gameover'; createExplosion(player.x,player.y,50); return; }
    }
    if (m.y>GAME_HEIGHT+50) meteors.splice(i,1);
  }
}

function updateParticles() {
  particles = particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.vx*=0.97; p.vy*=0.97; p.life--; return p.life>0; });
  explosions = explosions.filter(e => { e.life--; e.y-=0.5; return e.life>0; });
}

function updateStars() {
  for (const s of stars) { s.y+=s.speed; if (s.y>GAME_HEIGHT) { s.y=0; s.x=Math.random()*GAME_WIDTH; } }
}

function drawDragon(x, y, w, h, invincible) {
  ctx.save(); ctx.translate(x, y);
  if (invincible > 0 && Math.floor(frameCount / 3) % 2 === 0) ctx.globalAlpha = 0.5;
  const grad = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
  grad.addColorStop(0, '#44dd44'); grad.addColorStop(0.5, '#22bb22'); grad.addColorStop(1, '#118811');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(0, 0, w*0.3, h*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#55ee55';
  ctx.beginPath(); ctx.ellipse(0, -h*0.3, w*0.22, h*0.15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-6, -h*0.33, 4, 0, Math.PI*2); ctx.arc(6, -h*0.33, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-6, -h*0.33, 2, 0, Math.PI*2); ctx.arc(6, -h*0.33, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#33aa33';
  const wf = Math.sin(frameCount * 0.3) * 5;
  ctx.beginPath(); ctx.moveTo(-w*0.25, -5); ctx.lineTo(-w*0.7, -15+wf); ctx.lineTo(-w*0.6, 5+wf); ctx.lineTo(-w*0.25, 5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(w*0.25, -5); ctx.lineTo(w*0.7, -15+wf); ctx.lineTo(w*0.6, 5+wf); ctx.lineTo(w*0.25, 5); ctx.fill();
  ctx.strokeStyle = '#22aa22'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, h*0.3); ctx.quadraticCurveTo(-10, h*0.45, -5, h*0.55); ctx.stroke();
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath(); ctx.moveTo(-8, -h*0.4); ctx.lineTo(-12, -h*0.52); ctx.lineTo(-5, -h*0.4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8, -h*0.4); ctx.lineTo(12, -h*0.52); ctx.lineTo(5, -h*0.4); ctx.fill();
  ctx.restore();
}

function drawEnemyDragon(x, y, w, h, hp, maxHp, type) {
  ctx.save(); ctx.translate(x, y);
  const colors = [['#dd4444','#bb2222','#991111'],['#ddaa44','#bb8822','#996611'],['#dd44dd','#bb22bb','#991199'],['#4488dd','#2266bb','#114499']];
  const c = colors[type % colors.length];
  ctx.fillStyle = c[0];
  ctx.beginPath(); ctx.ellipse(0, 0, w*0.3, h*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = c[1];
  ctx.beginPath(); ctx.ellipse(0, h*0.3, w*0.22, h*0.15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff0';
  ctx.beginPath(); ctx.arc(-6, h*0.27, 4, 0, Math.PI*2); ctx.arc(6, h*0.27, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f00';
  ctx.beginPath(); ctx.arc(-6, h*0.27, 2, 0, Math.PI*2); ctx.arc(6, h*0.27, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = c[2];
  const wf = Math.sin(frameCount*0.25+x)*5;
  ctx.beginPath(); ctx.moveTo(-w*0.25,5); ctx.lineTo(-w*0.7,15+wf); ctx.lineTo(-w*0.6,-5+wf); ctx.lineTo(-w*0.25,-5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(w*0.25,5); ctx.lineTo(w*0.7,15+wf); ctx.lineTo(w*0.6,-5+wf); ctx.lineTo(w*0.25,-5); ctx.fill();
  if (hp < maxHp) {
    const bw = w*0.8, bh = 4;
    ctx.fillStyle = '#333'; ctx.fillRect(-bw/2, -h/2-12, bw, bh);
    ctx.fillStyle = hp/maxHp > 0.5 ? '#4f4' : hp/maxHp > 0.25 ? '#ff4' : '#f44';
    ctx.fillRect(-bw/2, -h/2-12, bw*(hp/maxHp), bh);
  }
  ctx.restore();
}

function drawBossDragon(x, y, w, h, hp, maxHp) {
  ctx.save(); ctx.translate(x, y);
  const pulse = Math.sin(frameCount*0.1)*0.1+1;
  ctx.strokeStyle = 'rgba(255,50,50,0.3)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0,0,w*0.6*pulse,h*0.6*pulse,0,0,Math.PI*2); ctx.stroke();
  const grad = ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);
  grad.addColorStop(0,'#ff2222'); grad.addColorStop(0.5,'#cc0000'); grad.addColorStop(1,'#880000');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(0,0,w*0.4,h*0.45,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff4444';
  ctx.beginPath(); ctx.ellipse(0,h*0.35,w*0.28,h*0.18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff0';
  ctx.beginPath(); ctx.ellipse(-10,h*0.3,6,5,-0.2,0,Math.PI*2); ctx.ellipse(10,h*0.3,6,5,0.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f00';
  ctx.beginPath(); ctx.arc(-10,h*0.3,3,0,Math.PI*2); ctx.arc(10,h*0.3,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#aa0000';
  const wf = Math.sin(frameCount*0.15)*10;
  ctx.beginPath(); ctx.moveTo(-w*0.3,0); ctx.lineTo(-w*1.0,-20+wf); ctx.lineTo(-w*0.9,20+wf); ctx.lineTo(-w*0.3,15); ctx.fill();
  ctx.beginPath(); ctx.moveTo(w*0.3,0); ctx.lineTo(w*1.0,-20+wf); ctx.lineTo(w*0.9,20+wf); ctx.lineTo(w*0.3,15); ctx.fill();
  ctx.fillStyle = '#ff8800';
  ctx.beginPath(); ctx.moveTo(-12,-h*0.35); ctx.lineTo(-20,-h*0.55); ctx.lineTo(-5,-h*0.38); ctx.fill();
  ctx.beginPath(); ctx.moveTo(12,-h*0.35); ctx.lineTo(20,-h*0.55); ctx.lineTo(5,-h*0.38); ctx.fill();
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath(); ctx.moveTo(-15,-h*0.35); ctx.lineTo(-10,-h*0.45); ctx.lineTo(-5,-h*0.38);
  ctx.lineTo(0,-h*0.48); ctx.lineTo(5,-h*0.38); ctx.lineTo(10,-h*0.45); ctx.lineTo(15,-h*0.35); ctx.fill();
  const bw = w*1.2, bh = 8;
  ctx.fillStyle = '#333'; ctx.fillRect(-bw/2, -h/2-20, bw, bh);
  ctx.fillStyle = hp/maxHp > 0.5 ? '#4f4' : hp/maxHp > 0.25 ? '#ff4' : '#f44';
  ctx.fillRect(-bw/2, -h/2-20, bw*(hp/maxHp), bh);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(-bw/2, -h/2-20, bw, bh);
  ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
  ctx.fillText('?? BOSS ??', 0, -h/2-26);
  ctx.restore();
}

function drawBullet(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  if (b.isEnemy) {
    ctx.fillStyle = '#ff4444';
    ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,100,100,0.3)';

    ctx.fillRect(-2,-8,4,16);

  ctx.restore();
}

function drawCoin(x, y) {

function drawItem(item) {
  ctx.save(); ctx.translate(item.x, item.y);
  const bob = Math.sin(frameCount*0.1)*3; ctx.translate(0, bob);
  ctx.shadowColor = item.color; ctx.shadowBlur = 15;
  const colors = { attack:'#ff8800', magnet:'#8844ff', shield:'#44aaff' };
  ctx.fillStyle = colors[item.type] || '#fff'; ctx.beginPath();
  if (item.type === 'attack') {
    ctx.moveTo(0,-10); ctx.lineTo(4,-3); ctx.lineTo(-1,-3); ctx.lineTo(2,10);
    ctx.lineTo(-2,3); ctx.lineTo(1,3); ctx.lineTo(-2,-10);
  } else if (item.type === 'magnet') { ctx.arc(0,0,10,0,Math.PI*2); }
  else { ctx.moveTo(0,-12); ctx.lineTo(10,-6); ctx.lineTo(10,2);
    ctx.quadraticCurveTo(10,12,0,15); ctx.quadraticCurveTo(-10,12,-10,2); ctx.lineTo(-10,-6); }
  ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center';
  const labels = { attack:'공격UP', magnet:'자석', shield:'방어막' };
  ctx.fillText(labels[item.type]||'?', 0, -18);
  ctx.restore();
}

function drawMeteorWarning(x, y, width) {

function drawMeteor(m) {
  ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(frameCount*0.1);
  ctx.fillStyle = '#886644'; ctx.beginPath();
  for (let i=0;i<6;i++) { const a=(Math.PI*2/6)*i, r=15+Math.sin(i*2.5)*5;
    if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#aa8866'; ctx.beginPath();
  for (let i=0;i<6;i++) { const a=(Math.PI*2/6)*i, r=8+Math.cos(i*3)*3;
    if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,150,0,0.5)'; ctx.beginPath();
  ctx.moveTo(-10,15); ctx.lineTo(0,35+Math.random()*10); ctx.lineTo(10,15); ctx.fill();
  ctx.restore();
}

function createExplosion(x, y, size, color) {

function update() {
  frameCount++;
  if (gameState===STATE.PLAYING) {
    distance += 0.5+waveNumber*0.02;
    difficultyMultiplier = 1+waveNumber*0.03;
    updatePlayer(); fireBullets(); updateBullets(); updateEnemies();
    updateMeteors(); updateCollisions(); updateParticles(); updateStars();
  } else if (gameState===STATE.CONTINUE_COUNTDOWN) {
    continueCountdown--;
    if (continueSelected) {
      // 컨티뉴 실행
      gameState = STATE.PLAYING;
      player.x = GAME_WIDTH/2; player.y = GAME_HEIGHT-100;
      player.attackLevel = 1; player.magnetRange = 0;
      player.shieldActive = false; player.shieldTimer = 0;
      player.fireRate = 8; player.fireTimer = 0; player.invincible = 120;
      player.trailParticles = [];
      bullets=[]; enemies=[]; enemyBullets=[]; particles=[];
      dropItems=[]; meteorWarnings=[]; meteors=[]; explosions=[];
      bossActive = false;
      waveNumber = (stageNumber - 1) * 5; // 현재 스테이지의 첫 웨이브부터
      spawnWave();
    } else if (continueCountdown <= 0) {
      // 시간 초과 -> 타이틀
      gameState = STATE.MENU;
    }
  } else if (gameState===STATE.STAGE_CLEAR) {
    stageClearTimer--;
    updateStars();
    if (stageClearTimer <= 0) {
      // 다음 스테이지로
      stageNumber++;
      waveNumber = (stageNumber - 1) * 5;
      bossActive = false;
      gameState = STATE.PLAYING;
      player.invincible = 90;
      spawnWave();
    }
  }
}

function draw() {
  ctx.clearRect(0,0,GAME_WIDTH,GAME_HEIGHT);
  if (gameState===STATE.MENU) { drawMenu(); return; }
  if (gameState===STATE.CREDIT_INSERT) { drawCreditInsert(); return; }
  if (gameState===STATE.STAGE_CLEAR) { drawStageClear(); return; }
  if (gameState===STATE.CONTINUE_COUNTDOWN) { drawContinueCountdown(); return; }
  
  const bgGrad = ctx.createLinearGradient(0,0,0,GAME_HEIGHT);
  bgGrad.addColorStop(0,'#050520'); bgGrad.addColorStop(0.5,'#0a0a35'); bgGrad.addColorStop(1,'#0f0f25');
  ctx.fillStyle=bgGrad; ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
  for (const s of stars) {
    const bright = 0.3+Math.sin(frameCount*0.02+s.brightness*10)*0.3;
    ctx.fillStyle=`rgba(255,255,255,${bright})`; ctx.fillRect(s.x,s.y,s.size,s.size);
  }
  for (const w of meteorWarnings) drawMeteorWarning(w.x, w.y, w.width);
  for (const m of meteors) drawMeteor(m);
  for (const p of player.trailParticles) {
    const alpha = p.life/20;
    ctx.fillStyle=`rgba(100,255,100,${alpha*0.3})`; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  }
  if (gameState===STATE.PLAYING) drawDragon(player.x, player.y, player.width, player.height, player.invincible>0);
  for (const b of bullets) drawBullet(b);
  for (const b of enemyBullets) drawBullet(b);
  for (const e of enemies) { if (e.isBoss) drawBossDragon(e.x,e.y,e.width,e.height,e.hp,e.maxHp);
    else drawEnemyDragon(e.x,e.y,e.width,e.height,e.hp,e.maxHp,e.type); }
  for (const item of dropItems) { if (item.type==='coin') drawCoin(item.x,item.y); else drawItem(item); }
  for (const p of particles) {
    const alpha = p.life/p.maxLife;
    ctx.fillStyle = p.color.replace(')',`, ${alpha})`).replace('hsl','hsla');
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*alpha,0,Math.PI*2); ctx.fill();
  }
  for (const e of explosions) {
    if (e.type==='text') { const alpha=e.life/e.maxLife; ctx.globalAlpha=alpha;
      ctx.fillStyle=e.color; ctx.font='bold 14px Arial'; ctx.textAlign='center';
      ctx.fillText(e.text,e.x,e.y); ctx.globalAlpha=1; }
  }
  drawUI();
  if (gameState===STATE.GAMEOVER) drawGameOver();
}

function drawCreditInsert() {
  // 크레딧 투입 화면
  ctx.fillStyle='#0a0a2e'; ctx.fillRect(0,0,GAME_WIDTH,GAME_HEIGHT);
  for (const s of stars) {
    s.y+=s.speed*0.3; if (s.y>GAME_HEIGHT) { s.y=0; s.x=Math.random()*GAME_WIDTH; }
    ctx.fillStyle=`rgba(255,255,255,${0.2+s.brightness*0.3})`; ctx.fillRect(s.x,s.y,s.size,s.size);
  }
  
  const centerY = GAME_HEIGHT * 0.35;
  
  // 크레딧 투입 UI
  ctx.fillStyle='#ff88ff'; ctx.font=`bold ${isMobile ? 28 : 36}px Arial`; ctx.textAlign='center';
  ctx.fillText('크레딧 투입', GAME_WIDTH/2, centerY);
  
  ctx.fillStyle='#aaa'; ctx.font=`${isMobile ? 13 : 16}px Arial`;
  ctx.fillText('Credit Insert', GAME_WIDTH/2, centerY+30);
  
  // 코인 삽입 그래픽 (간단히)
  const coinY = centerY + 100;
  const pulse = Math.sin(frameCount*0.05)*5;
  ctx.fillStyle='#ffcc00'; ctx.beginPath();
  ctx.arc(GAME_WIDTH/2, coinY, 30+pulse, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#cc9900'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#ffee66'; ctx.beginPath();
  ctx.arc(GAME_WIDTH/2, coinY, 20+pulse*0.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#cc9900'; ctx.font='bold 20px Arial';
  ctx.fillText('$', GAME_WIDTH/2, coinY+7);
  
  const blink = Math.floor(frameCount/20)%2===0;
  if (blink) {
    ctx.fillStyle='#ffcc00'; ctx.font=`bold ${isMobile ? 14 : 16}px Arial`;
    ctx.fillText('[ 스페이스바 / 엔터 ]로 투입', GAME_WIDTH/2, coinY+70);
  }
  
  ctx.fillStyle='#888'; ctx.font=`${isMobile ? 11 : 13}px Arial`;
  ctx.fillText('[ ESC / 백스페이스 ] 나가기', GAME_WIDTH/2, coinY+100);
  
  ctx.fillStyle='#ff88ff'; ctx.font=`bold ${isMobile ? 12 : 14}px Arial`;
  ctx.fillText(`현재 크레딧: ${arcadeCredits}`, GAME_WIDTH/2, coinY+145);
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
