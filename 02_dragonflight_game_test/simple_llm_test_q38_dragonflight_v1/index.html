<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dragon Flight</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05070f;
    overflow: hidden;
    touch-action: none;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
  }
  #game-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, #0b1230 0%, #05070f 70%);
  }
  canvas {
    display: block;
    touch-action: none;
    box-shadow: 0 0 40px rgba(60, 120, 255, 0.25);
    border-radius: 6px;
  }
</style>
</head>
<body>
<div id="game-wrap"><canvas id="game"></canvas></div>
<script src="dragonflight.js"></script>
<script src="effects.js"></script>
</body>
</html>
