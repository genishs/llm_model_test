<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>드래곤플라이트 - 세로 스크롤 슈팅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #fff;
    font-family: sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #0d0d12;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    font-size: 16px;
    font-weight: bold;
  }
  #touch-hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 14px;
    pointer-events: none;
    display: none;
  }
  #stat { display: flex; gap: 15px; }
  .stat-item { background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 4px; border: 1px solid #555; }
  #credit-bar {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 20px;
    background: #333;
    border: 2px solid #ffd700;
    border-radius: 4px;
    overflow: hidden;
    pointer-events: none;
    display: none;
  }
  #credit-fill {
    width: 0%;
    height: 100%;
    background: #ffd700;
    transition: width 0.3s;
  }
  #credit-label {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd700;
    font-weight: bold;
    pointer-events: none;
    display: none;
  }
  #stage-label {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    pointer-events: none;
    display: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  h1 { font-size: 32px; margin-bottom: 10px; color: #ffd700; }
  p { margin: 5px 0; font-size: 16px; }
  #touch-hint { display: block; margin: 8px 0; font-size: 14px; color: #888; }
  button {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    background: #ffd700;
    color: #000;
    border: none;
    border-radius: 4px;
    margin-top: 10px;
  }
  button:hover { background: #fff; }
  #continue-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    pointer-events: auto;
  }
  #continue-screen button { margin-top: 15px; }
  #start-screen, #game-over-screen { display: flex; flex-direction: column; align-items: center; text-align: center; }
  #warning {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    font-weight: bold;
    color: #ff0000;
    display: none;
    pointer-events: none;
    text-shadow: 2px 2px 4px #000;
  }
</style>
</head>
<body>
  <div id="ui">
    <div id="stat">
      <div class="stat-item">점수: <span id="score">0</span></div>
      <div class="stat-item">거리: <span id="distance">0</span>m</div>
      <div class="stat-item">코인: <span id="coin">0</span></div>
    </div>
  </div>
  <div id="touch-hint">손가락을 끌어 좌우로 이동하세요</div>
  <div id="warning">운석 경고!</div>
  <div id="credit-bar"><div id="credit-fill"></div></div>
  <div id="credit-label">크레딧: <span id="credit-count">0</span></div>
  <div id="stage-label">스테이지: <span id="stage-count">1</span></div>
  <canvas id="game" width="400" height="800"></canvas>
  <div id="overlay">
    <div id="start-screen">
      <h1>드래곤플라이트</h1>
      <p>세로 스크롤 슈팅 게임</p>
      <p>←/→ 또는 마우스로 이동, 공격은 자동</p>
      <button onclick="startGame()">시작</button>
    </div>
    <div id="touch-hint-start">손가락을 끌어 좌우로 이동하세요</div>
    <div id="game-over-screen" style="display:none;">
      <h1>게임 오버</h1>
      <p id="final-score">최고 점수: 0</p>
      <button onclick="startGame()">다시 시작</button>
    </div>
  </div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const distanceEl = document.getElementById('distance');
const coinEl = document.getElementById('coin');
const creditEl = document.getElementById('credit-count');
const creditBarEl = document.getElementById('credit-fill');
const creditLabelEl = document.getElementById('credit-label');
const creditBarContainerEl = document.getElementById('credit-bar');
const stageEl = document.getElementById('stage-count');
const stageLabelEl = document.getElementById('stage-label');
const warningEl = document.getElementById('warning');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const finalScoreEl = document.getElementById('final-score');
const continueScreen = document.createElement('div');
continueScreen.id = 'continue-screen';
continueScreen.style.display = 'none';
continueScreen.innerHTML = `
  <h1>계속?</h1>
  <p id="continue-timer">계속 가능 시간: <span id="continue-timer-value">3</span>초</p>
  <p>크레딧을 소비하여 이어서 할 수 있습니다</p>
  <button onclick="tryContinue()">이어하기</button>
`;
document.getElementById('overlay').appendChild(continueScreen);
const continueTimerEl = document.getElementById('continue-timer-value');

const WIDTH = 400;
const HEIGHT = 800;
const PLAYER_SPEED = 5;
const BULLET_SPEED = 8;
const ENEMY_BASE_SPEED = 1.5;
const METEOR_SPEED = 3;

let gameRunning = false;
let score = 0;
let distance = 0;
let coins = 0;
let credits = 0;
let highScore = 0;
let difficulty = 1;
let frameCount = 0;
let stage = 1;
let stageDistance = 0;
let continueCountdown = 3;
let continueInterval = null;

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

let player = { x: WIDTH/2, y: HEIGHT - 60, w: 30, h: 30, speed: PLAYER_SPEED };
let touchActive = false;
let touchLastX = 0;
let bullets = [];
let enemies = [];
let items = [];
let meteors = [];
let particles = [];

function spawnEnemy() {
  const lane = Math.floor(Math.random() * 4) + 0.5;
  const x = lane * (WIDTH/4);
  const type = Math.random() > 0.8 ? 'normal' : 'tank';
  const enemy = {
    x: x - 20, y: -40, w: 40, h: 40,
    speed: ENEMY_BASE_SPEED * difficulty,
    hp: type === 'tank' ? 3 : 1,
    maxHp: type === 'tank' ? 3 : 1,
    type,
    lane
  };
  enemies.push(enemy);
}

function spawnItem(type, x, y) {
  items.push({
    x: x - 10, y: y - 20, w: 20, h: 20,
    type, speed: 2,
    life: 300
  });
}

function spawnCreditCoin(x, y) {
  items.push({
    x: x - 10, y: y - 20, w: 20, h: 20,
    type: 'credit-coin', speed: 2,
    life: 300
  });
}

function spawnMeteor() {
  const lane = Math.floor(Math.random() * 4) + 0.5;
  const x = lane * (WIDTH/4);
  meteors.push({
    x: x - 25, y: -60, w: 50, h: 50,
    speed: METEOR_SPEED * difficulty,
    warning: true
  });
}

function createParticles(x, y, color, count = 5) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 30,
      color
    });
  }
}

function update() {
  if (!gameRunning) return;
  frameCount++;
  distance += 0.1;
  distanceEl.textContent = Math.floor(distance).toString();
  scoreEl.textContent = score;
  coinEl.textContent = coins;

  // stage / difficulty increase
  if (Math.floor(distance) % 200 === 0 && Math.floor(distance) > 0) {
    difficulty += 0.2;
  }
  stageDistance += 0.1;
  if (stageDistance >= 500) {
    stage++;
    stageDistance = 0;
    difficulty += 0.3;
    stageEl.textContent = stage;
    stageLabelEl.style.display = 'block';
    setTimeout(() => { stageLabelEl.style.display = 'none'; }, 2000);
    if (credits < 5) credits += 1;
    updateCreditUI();
  }

  // player movement
  if (keys['ArrowLeft'] || keys['ArrowRight']) {
    const dir = keys['ArrowLeft'] ? -1 : 1;
    player.x += player.speed * dir;
  }
  player.x = Math.max(0, Math.min(player.x - player.w/2, WIDTH - player.w));

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= BULLET_SPEED;
    if (bullets[i].y < 0) bullets.splice(i, 1);
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;
    // collision with bullets
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
        e.hp--;
        bullets.splice(j, 1);
        createParticles(e.x + e.w/2, e.y + e.h/2, '#fff', 3);
        if (e.hp <= 0) {
          score += e.type === 'tank' ? 50 : 20;
          if (Math.random() > 0.5) spawnItem('coin', e.x + e.w/2, e.y + e.h/2);
          if (Math.random() > 0.8) spawnItem('power', e.x + e.w/2, e.y + e.h/2);
          if (Math.random() > 0.9) spawnItem('shield', e.x + e.w/2, e.y + e.h/2);
          if (e.type === 'boss' && Math.random() > 0.8) spawnCreditCoin(e.x + e.w/2, e.y + e.h/2);
          enemies.splice(i, 1);
          i--;
          break;
        }
      }
    }
    // collision with player
    if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
      gameOver();
      return;
    }
    if (e.y > HEIGHT) {
      enemies.splice(i, 1);
      gameOver();
      return;
    }
  }

  // items
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.speed;
    if (player.x < it.x + it.w && player.x + player.w > it.x && player.y < it.y + it.h && player.y + player.h > it.y) {
      if (it.type === 'coin') coins += 1;
    if (it.type === 'credit-coin') credits += 1;
      else if (it.type === 'power') {
        // bullet speed boost visual only
        createParticles(it.x + it.w/2, it.y + it.h/2, '#ffd700', 5);
      } else if (it.type === 'shield') {
        createParticles(it.x + it.w/2, it.y + it.h/2, '#00ffff', 5);
      }
      items.splice(i, 1);
    }
    if (it.y > HEIGHT || it.life <= 0) items.splice(i, 1);
    it.life--;
  }

  // meteors
  if (frameCount % (300 - difficulty * 20) === 0) spawnMeteor();
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.y += m.speed;
    if (m.warning) {
      warningEl.style.display = 'block';
      setTimeout(() => warningEl.style.display = 'none', 1000);
      m.warning = false;
    }
    if (player.x < m.x + m.w && player.x + player.w > m.x && player.y < m.y + m.h && player.y + player.h > m.y) {
      gameOver();
      return;
    }
    if (m.y > HEIGHT) meteors.splice(i, 1);
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // boss
  if (Math.floor(distance) % 500 === 0 && Math.floor(distance) > 0 && frameCount % 600 === 0) {
    const boss = {
      x: WIDTH/2 - 60, y: -120, w: 120, h: 120,
      hp: 10 + difficulty * 5, maxHp: 10 + difficulty * 5,
      speed: ENEMY_BASE_SPEED * difficulty * 0.5,
      type: 'boss'
    };
    enemies.push(boss);
  }

  // auto shoot
  if (frameCount % 10 === 0) {
    bullets.push({ x: player.x + player.w/2 - 5, y: player.y - 10, w: 10, h: 20 });
  }
}

function draw() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);
  // player
  ctx.fillStyle = '#00ffff';
  ctx.beginPath();
  ctx.arc(player.x + player.w/2, player.y + player.h/2, player.w/2, 0, Math.PI*2);
  ctx.fill();
  // bullets
  ctx.fillStyle = '#ffd700';
  for (const b of bullets) {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  // enemies
  for (const e of enemies) {
    ctx.fillStyle = e.type === 'boss' ? '#ff0000' : e.type === 'tank' ? '#aaaaaa' : '#ff4444';
    ctx.fillRect(e.x, e.y, e.w, e.h);
    // hp bar
    ctx.fillStyle = 'black';
    ctx.fillRect(e.x, e.y - 8, e.w, 6);
    ctx.fillStyle = 'green';
    ctx.fillRect(e.x, e.y - 8, (e.w * e.hp / e.maxHp), 6);
  }
  // items
  for (const it of items) {
    if (it.type === 'credit-coin') ctx.fillStyle = '#ffff00';
    else if (it.type === 'coin') ctx.fillStyle = '#ffd700';
    else if (it.type === 'power') ctx.fillStyle = '#ff44ff';
    else ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(it.x + it.w/2, it.y + it.h/2, it.w/2, 0, Math.PI*2);
    ctx.fill();
  }
  // meteors
  for (const m of meteors) {
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(m.x + m.w/2, m.y + m.h/2, m.w/2, 0, Math.PI*2);
    ctx.fill();
  }
  // particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
  }
}

function gameOver() {
  gameRunning = false;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('dragonflight_highscore', highScore);
  }
  finalScoreEl.textContent = `최고 점수: ${highScore}`;
  gameOverScreen.style.display = 'none';
  continueScreen.style.display = 'flex';
  continueCountdown = 3;
  continueTimerEl.textContent = continueCountdown;
  continueInterval = setInterval(() => {
    continueCountdown--;
    continueTimerEl.textContent = continueCountdown;
    if (continueCountdown <= 0) {
      clearInterval(continueInterval);
      continueInterval = null;
      continueScreen.style.display = 'none';
      startScreen.style.display = 'flex';
    }
  }, 1000);
}

function startGame() {
  if (credits < 1) return;
  credits--;
  gameRunning = true;
  score = 0;
  distance = 0;
  coins = 0;
  difficulty = 1;
  frameCount = 0;
  stage = 1;
  stageDistance = 0;
  stageEl.textContent = stage;
  player.x = WIDTH/2;
  bullets = [];
  enemies = [];
  items = [];
  meteors = [];
  particles = [];
  warningEl.style.display = 'none';
  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  continueScreen.style.display = 'none';
  if (continueInterval) { clearInterval(continueInterval); continueInterval = null; }
  updateCreditUI();
  requestAnimationFrame(loop);
}

function loop() {
  update();
  draw();
  if (gameRunning) requestAnimationFrame(loop);
}

function tryContinue() {
  if (credits < 1) return;
  credits--;
  gameRunning = true;
  continueScreen.style.display = 'none';
  if (continueInterval) { clearInterval(continueInterval); continueInterval = null; }
  updateCreditUI();
  requestAnimationFrame(loop);
}

function updateCreditUI() {
  creditEl.textContent = credits;
  creditBarEl.style.width = Math.min(credits * 20, 100) + '%';
  creditBarContainerEl.style.display = 'block';
  creditLabelEl.style.display = 'block';
}

// touch/mouse control
let touchActive = false;
let touchLastX = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchActive = true;
  touchLastX = e.touches[0].clientX;
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  if (!touchActive) return;
  e.preventDefault();
  const dx = e.touches[0].clientX - touchLastX;
  player.x += dx * 0.5;
  player.x = Math.max(0, Math.min(player.x - player.w/2, WIDTH - player.w));
  touchLastX = e.touches[0].clientX;
}, {passive: false});
canvas.addEventListener('touchend', () => {
  touchActive = false;
});
canvas.addEventListener('mousedown', e => {
  touchLastX = e.clientX;
});
canvas.addEventListener('mousemove', e => {
  if (e.buttons & 1) {
    const dx = e.clientX - touchLastX;
    player.x += dx * 0.5;
    player.x = Math.max(0, Math.min(player.x - player.w/2, WIDTH - player.w));
    touchLastX = e.clientX;
  }
});

window.addEventListener('load', () => {
  const saved = localStorage.getItem('dragonflight_highscore');
  if (saved) highScore = parseInt(saved);
  finalScoreEl.textContent = `최고 점수: ${highScore}`;
  const savedCredits = localStorage.getItem('dragonflight_credits');
  if (savedCredits) credits = parseInt(savedCredits);
  const savedStage = localStorage.getItem('dragonflight_stage');
  if (savedStage) stage = parseInt(savedStage);
  stageEl.textContent = stage;
  updateCreditUI();
});

const touchHint = document.getElementById('touch-hint');
const touchHintStart = document.getElementById('touch-hint-start');
const isMobile = /iPhone|iPod|iPad|Android|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
if (isMobile) {
  touchHint.style.display = 'block';
  touchHintStart.style.display = 'block';
}
updateCreditUI();
</script>
</body>
</html>
