<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070f">
<title>Dragon Flight</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05070f;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
  }
  #game-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, #0b1230 0%, #05070f 70%);
  }
  canvas {
    display: block;
    touch-action: none;
    box-shadow: 0 0 40px rgba(60, 120, 255, 0.25);
    border-radius: 6px;
  }
  /* small phones: drop the rounding/shadow for an edge-to-edge feel */
  @media (max-width: 480px) {
    canvas { border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div id="game-wrap"><canvas id="game"></canvas></div>
<script src="dragonflight.js"></script>
<script src="effects.js"></script>
</body>
</html>
