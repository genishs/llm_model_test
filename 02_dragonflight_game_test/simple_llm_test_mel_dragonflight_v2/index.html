<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DragonFlight</title>
<style>
canvas { background:#87CEEB; display:block; margin:0 auto; }
#ui { position:absolute; top:10px; left:10px; color:white; font-family:Arial; }
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span> Distance: <span id="distance">0</span> Coins: <span id="coins">0</span></div>
<canvas id="game" width="800" height="600"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let player={x:canvas.width/2,y:canvas.height-50,width:40,height:20}, touchX=0, isTouching=false;
let bullets=[];
let enemies=[];
let coins=[];
let score=0;
let distance=0;
let coinsCollected=0;
let gameState='start';
let lastTime=0;
let enemySpeed=1;
let spawnTimer=0;
let shootTimer=0;
const shootInterval=30; // frames
let keys={};
function init(){
  document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Enter'||e.key===' ') gameState==='start'&&startGame();});
  canvas.addEventListener('touchstart',handleTouchStart);
  canvas.addEventListener('touchmove',handleTouchMove);
  canvas.addEventListener('touchend',handleTouchEnd);
}
function handleTouchStart(e) {
  e.preventDefault();
  if (gameState === 'play' && !isTouching) {
    const touch = e.touches[0];
    touchX = touch.clientX;
    isTouching = true;
  }
}
function handleTouchMove(e) {
  e.preventDefault();
  if (gameState === 'play' && isTouching) {
    const touch = e.touches[0];
    const deltaX = touch.clientX - touchX;
    if (Math.abs(deltaX) > 10) {
      if (deltaX > 0) {
        keys['ArrowRight'] = true;
        keys['ArrowLeft'] = false;
      } else {
        keys['ArrowLeft'] = true;
        keys['ArrowRight'] = false;
      }
      touchX = touch.clientX;
    }
  }
}
function handleTouchEnd(e) {
  e.preventDefault();
  if (gameState === 'play') {
    isTouching = false;
    keys['ArrowLeft'] = false;
    keys['ArrowRight'] = false;
  }
}
function startGame(){
  player={x:canvas.width/2,y:canvas.height-50,width:40,height:20};
  bullets=[];
  enemies=[];
  coins=[];
  score=0;
  coinsCollected=0;
  distance=0;
  gameState='play';
  enemySpeed=1;
}
function update(currentTime) {
  const dt=(currentTime-lastTime)/16;
  lastTime=currentTime;
  if(gameState==='start') {
    drawStart();
    return;
  }
  if(gameState!=='play') return;
  movePlayer();
  spawnEnemies();
  updateBullets();
  updateEnemies();
  updateCoins();
  checkCollisions();
  if(shootTimer>shootInterval) {
    shoot();
    shootTimer=0;
  } else {
    shootTimer++;
  }
  distance+=enemySpeed*dt;
  document.getElementById('distance').textContent=Math.floor(distance);
  draw();
  requestAnimationFrame(update);
}
function movePlayer() {
  if(isTouching) {
    // Touch movement: move based on touch position
    const moveSpeed = 5;
    if(touchX < canvas.width/2) {
      player.x -= moveSpeed;
    } else {
      player.x += moveSpeed;
    }
  } else {
    if(keys['ArrowLeft']) player.x-=5;
    if(keys['ArrowRight']) player.x+=5;
  }
  player.x=Math.max(player.width/2,Math.min(canvas.width-player.width/2,player.x));
}
function spawnEnemies() {
  if(Math.random()<0.01) {
    enemies.push({x:Math.random()*canvas.width,y:-20,width:30,height:30,health:1});
  }
  for(let i=enemies.length-1;i>=0;i--) {
    if(enemies[i].y>canvas.height) {
      gameState='over';
      break;
    }
  }
}
function updateBullets() {
  for(let i=bullets.length-1;i>=0;i--) {
    bullets[i].y-=5;
    if(bullets[i].y<0) bullets.splice(i,1);
    else {
      for(let j=enemies.length-1;j>=0;j--) {
        if(bullets[i].x>enemies[j].x&&bullets[i].x<enemies[j].x+enemies[j].width&&bullets[i].y>enemies[j].y&&bullets[i].y<enemies[j].y+enemies[j].height) {
          enemies[j].health--;
          if(enemies[j].health<=0) {
            enemies.splice(j,1);
            score+=10;
            spawnCoin(enemies[j].x,enemies[j].y);
            bullets.splice(i,1);
            j=-1;
            continue;
          }
        }
      }
    }
  }
}
function updateEnemies() {
  enemies.forEach(e=>e.y+=enemySpeed);
}
function updateCoins() {
  for(let i=coins.length-1;i>=0;i--) {
    coins[i].y+=2;
    if(coins[i].y>canvas.height) {
      coins.splice(i,1);
    } else {
      if(coins[i].x>player.x&&coins[i].x<player.x+player.width&&coins[i].y>player.y&&coins[i].y<player.y+player.height) {
        coinsCollected++;
        coins.splice(i,1);
        document.getElementById('coins').textContent=coinsCollected;
      }
    }
  }
}
function checkCollisions() {
  enemies.forEach(e=>{ 
    if(player.x<e.x+e.width&&player.x+player.width>e.x&&player.y<e.y+e.height&&player.y+player.height>e.y) {
      gameState='over';
    }
  });
}
function shoot() {
  bullets.push({x:player.x+player.width/2,y:player.y,radius:3});
}
function spawnCoin(x,y) {
  coins.push({x:x-7.5,y:y-7.5});
}
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#87CEEB';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // draw background lines
  ctx.strokeStyle='#FFFFFF';
  ctx.beginPath();
  for(let i=0;i<canvas.height;i+=40) {
    ctx.moveTo(0,i);
    ctx.lineTo(canvas.width,i);
  }
  ctx.stroke();
  drawPlayer();
  drawBullets();
  drawEnemies();
  drawCoins();
  drawUI();
}
function drawPlayer() {
  ctx.fillStyle='#FF0000';
  ctx.fillRect(player.x,player.y,player.width,player.height);
}
function drawBullets() {
  ctx.fillStyle='#FFFFFF';
  bullets.forEach(b=>ctx.fillRect(b.x-b.radius,b.y-b.radius,b.radius*2,b.radius*2));
}
function drawEnemies() {
  ctx.fillStyle='#0000FF';
  enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.width,e.height));
}
function drawCoins() {
  ctx.fillStyle='#FFFF00';
  coins.forEach(c=>ctx.fillRect(c.x,c.y,15,15));
}
function drawUI() {
  ctx.fillStyle='white';
  ctx.font='20px Arial';
  ctx.fillText('Score: '+score,10,30);
  ctx.fillText('Distance: '+Math.floor(distance),10,60);
  ctx.fillText('Coins: '+coinsCollected,10,90);
}
function drawStart() {
  ctx.fillStyle='white';
  ctx.font='40px Arial';
  ctx.textAlign='center';
  ctx.fillText('DragonFlight',canvas.width/2,canvas.height/2-50);
  ctx.font='20px Arial';
  ctx.fillText('Press Enter or Space to Start',canvas.width/2,canvas.height/2+10);
  ctx.fillText('Use Arrow Keys to Move',canvas.width/2,canvas.height/2+40);
}
init();
update(0);
</script>
</body>
</html>
