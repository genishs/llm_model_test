<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Tetris - Arcade Style with Credits & Continue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="header">
            <h1>TETRIS</h1>
            <div id="score-board">
                <div class="score-item">
                    <span>SCORE</span>
                    <span id="score">0</span>
                </div>
                <div class="score-item">
                    <span>LEVEL</span>
                    <span id="level">1</span>
                </div>
                <div class="score-item">
                    <span>LINES</span>
                    <span id="lines">0</span>
                </div>
                <div class="score-item">
                    <span>CREDITS</span>
                    <span id="credits">0</span>
                </div>
            </div>
        </div>
        
        <div id="game-area">
            <canvas id="game-canvas" width="240" height="480"></canvas>
            <div id="next-piece">
                <span>NEXT</span>
                <canvas id="next-canvas" width="80" height="80"></canvas>
            </div>
        </div>
        
        <div id="touch-controls">
            <div class="touch-row">
                <button id="btn-rotate" class="touch-btn">↻</button>
            </div>
            <div class="touch-row">
                <button id="btn-left" class="touch-btn">←</button>
                <button id="btn-down" class="touch-btn">↓</button>
                <button id="btn-right" class="touch-btn">→</button>
            </div>
            <button id="btn-drop" class="touch-btn drop-btn">DROP</button>
            <!-- Credit buttons -->
            <div class="touch-row" style="margin-top: 10px;">
                <button id="btn-credit" class="touch-btn credit-btn">COIN</button>
            </div>
        </div>
        
        <div id="controls">
            <h3>OPERATION</h3>
            <p>← → : Move</p>
            <p>↑ : Rotate</p>
            <p>↓ : Soft Drop</p>
            <p>SPACE : Hard Drop</p>
            <p>P : Pause</p>
            <p>ENTER : Start</p>
            <p>C / SPACE (title) : Add Credit</p>
        </div>
        
        <div id="overlay">
            <div id="overlay-content">
                <h2>TETRIS</h2>
                <p>Press ENTER to Start</p>
                <p id="credit-info">Insert Coin (C or SPACE)</p>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
