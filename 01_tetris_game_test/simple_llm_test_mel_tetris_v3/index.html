<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-info">
            <div id="score">Score: 0</div>
            <div id="level">Level: 1</div>
            <div id="lines">Lines: 0</div>
            <div id="credits">Credits: 0</div>
            <div id="add-credit-touch" style="position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; background: rgba(255,255,255,0.3); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 12px;">+</div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="touch-controls">
            <div class="touch-left">←</div>
            <div class="touch-up">↑</div>
            <div class="touch-right">→</div>
            <div class="touch-down">↓</div>
            <div class="touch-rotate">↻</div>
        </div>
        <div id="game-over" style="display: none;">
            <h2>Game Over</h2>
            <p>Continue in <span id="countdown">3</span> seconds...</p>
            <button id="restart-btn">Restart</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
